[package]
name = "omnivoice-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
candle-flash-attn = { workspace = true, optional = true }
fslock.workspace = true
half.workspace = true
hound.workspace = true
hf-hub.workspace = true
regex.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
rand.workspace = true
mistralrs-audio = { workspace = true, optional = true }
unicode-general-category.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { git = "https://github.com/FerrisMind/candle", rev = "addb4aaeaf9fa4ecd642cbfdde1a4863471c2254", version = "0.1.0", features = ["metal"] }
candle-nn = { git = "https://github.com/FerrisMind/candle", rev = "addb4aaeaf9fa4ecd642cbfdde1a4863471c2254", version = "0.1.0", features = ["metal"] }
candle-transformers = { git = "https://github.com/FerrisMind/candle", rev = "addb4aaeaf9fa4ecd642cbfdde1a4863471c2254", version = "0.1.0", features = ["metal"] }

[features]
default = []
audio-helper = ["dep:mistralrs-audio"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:candle-flash-attn"]
metal = []
vulkan = ["candle-core/vulkan", "candle-nn/vulkan", "candle-transformers/vulkan"]
wgpu = ["candle-core/wgpu", "candle-nn/wgpu", "candle-transformers/wgpu"]
phase6-tests = []
